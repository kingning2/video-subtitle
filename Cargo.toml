[package]
name = "video-subtitle"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Video subtitles: FFmpeg extract audio → Whisper ASR → SRT → FFmpeg burn-in"
readme = "README.md"
license = "MIT"
keywords = ["whisper", "subtitle", "ffmpeg", "srt", "video", "speech-recognition"]
categories = ["multimedia", "command-line-utilities"]
# 发布到 crates.io 前请改成你的名字和邮箱
authors = ["Your Name <you@example.com>"]
repository = "https://github.com/YOUR_USER/video-subtitle"
homepage = "https://github.com/YOUR_USER/video-subtitle"
documentation = "https://docs.rs/video-subtitle"
exclude = ["/target", "/.git", "*.mp4", "*.wav", "*.srt", "*.bin"]

[[bin]]
name = "video-subtitle"
path = "src/main.rs"

[lib]
name = "video_subtitle"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
thiserror = "2"
whisper-rs = "0.16"
