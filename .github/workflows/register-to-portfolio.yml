# Register this repo to kingning2/xiaoman-projects after deploy (or manual run).
#
# Required secrets (Settings → Secrets → Actions — never commit to git):
#   PORTFOLIO_PAT            — Fine-grained PAT with xiaoman-projects Contents write
#   PORTFOLIO_REGISTER_KEY     — same value as owner's xiaoman-projects secret
#
# Auto: runs after workflow "Deploy to GitHub Pages" succeeds on main/master.
# Manual: Actions → Register to portfolio → Run workflow (if Pages deploy is not set up yet).

name: Register to portfolio

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  register:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send asset to xiaoman-projects
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PORTFOLIO_PAT }}
          repository: kingning2/xiaoman-projects
          event-type: upsert-asset
          client-payload: |-
            {
              "registerKey": "${{ secrets.PORTFOLIO_REGISTER_KEY }}",
              "id": "${{ github.event_name == 'workflow_dispatch' && github.event.repository.name || github.event.workflow_run.head_repository.name }}",
              "type": "tool",
              "name": "video-subtitle",
              "description": "视频自动字幕：FFmpeg 提取音频 → Whisper 识别 → SRT → FFmpeg 烧录硬字幕（CLI + Rust 库）",
              "githubUrl": "${{ github.event_name == 'workflow_dispatch' && format('https://github.com/{0}', github.repository) || format('https://github.com/{0}', github.event.workflow_run.head_repository.full_name) }}",
              "tags": ["Rust", "CLI", "FFmpeg", "Whisper", "字幕", "crates.io"],
              "problemSolved": "本地视频一键生成并烧录中英文字幕，无需云端 API 或手工打轴",
              "updatedAt": "${{ github.event_name == 'workflow_dispatch' && github.event.repository.updated_at || github.event.workflow_run.updated_at }}"
            }
