# Publishes a minimal landing page. Name must match register-to-portfolio workflow_run.
#
# REQUIRED (once per repo, or deploy fails with "Get Pages site failed"):
#   https://github.com/kingning2/video-subtitle/settings/pages
#   Build and deployment → Source → "GitHub Actions"
# Then re-run this workflow (Actions → Deploy to GitHub Pages → Re-run).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages

      - id: deployment
        uses: actions/deploy-pages@v4
